<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nasro VIP - Queen Style</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <style>
        :root { 
            --p-dark: #ff4d6d; 
            --p-mid: #ff758f; 
            --bg-glass: rgba(255, 192, 203, 0.2);
            --me-bubble: #b392f0; /* بنفسجي */
            --other-bubble: #ff85a1; /* وردي */
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: #000; overflow: hidden; height: 100vh; color: white; }

        /* الحاسبة الأصلية */
        #calc-screen { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100vh; padding-bottom: 50px; background: #000; position: relative; z-index: 100; }
        #display { width: 100%; max-width: 350px; text-align: right; font-size: 80px; color: white; padding: 0 30px; }
        .buttons { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; width: 100%; max-width: 350px; padding: 10px; }
        .btn { height: 75px; width: 75px; border-radius: 50%; border: none; font-size: 30px; color: white; background: #333; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .orange { background: #ff758f; } .gray { background: #a5a5a5; color: black; }
        .zero { width: 162px; border-radius: 40px; justify-content: flex-start; padding-left: 30px; grid-column: span 2; }

        /* واجهة الدردشة */
        #chat-ui { display: none; height: 100vh; flex-direction: column; position: relative; background: #000; }
        #layer-bg { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            /* استعادة الخلفية القديمة */
            background-image: url('https://image2url.com/r2/default/images/1770449811893-f461bec6-24f2-48fd-b92b-59a5ba56bf71.jpg'); 
            background-size: cover; background-position: center; z-index: 0; filter: brightness(0.5); 
        }

        /* قلوب متحركة */
        .hearts-container { position: absolute; width: 100%; height: 100%; overflow: hidden; z-index: 1; pointer-events: none; }
        .heart { position: absolute; color: #ff85a1; font-size: 20px; animation: float 5s infinite linear; opacity: 0.8; }
        @keyframes float { 0% { transform: translateY(100vh) scale(0); opacity: 1; } 100% { transform: translateY(-10vh) scale(1.5); opacity: 0; } }

        .header { background: rgba(0, 0, 0, 0.7); backdrop-filter: blur(10px); padding: 15px; display: flex; justify-content: space-between; align-items: center; z-index: 10; border-bottom: 1px solid rgba(255,255,255,0.1); }
        #typing-status { font-size: 13px; color: #ff85a1; font-weight: bold; height: 18px; }

        #messages { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 15px; z-index: 2; }
        .bubble { padding: 12px 18px; border-radius: 20px; max-width: 80%; box-shadow: 0 4px 10px rgba(0,0,0,0.3); line-height: 1.5; color: #fff; }
        .me { align-self: flex-end; border-bottom-right-radius: 2px; background: var(--me-bubble); }
        .other { align-self: flex-start; border-bottom-left-radius: 2px; background: var(--other-bubble); }

        .footer { background: rgba(0, 0, 0, 0.9); padding: 12px; z-index: 10; border-top: 1px solid rgba(255,255,255,0.1); }
        .input-area { display: flex; align-items: center; gap: 10px; }
        .input-box { flex: 1; background: rgba(255,255,255,0.15); border-radius: 25px; height: 48px; display: flex; align-items: center; padding: 0 15px; border: 1.5px solid #ff85a1; }
        .input-box input { flex: 1; border: none; outline: none; background: transparent; color: white; font-size: 16px; }
        
        #sendBtn, #recBtn { background: #ff4d6d; color: white; width: 45px; height: 45px; border-radius: 50%; border: none; font-size: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        #recBtn.recording { background: #adff2f; animation: pulse 1s infinite; }
        @keyframes pulse { 0% {transform: scale(1);} 50% {transform: scale(1.1);} 100% {transform: scale(1);} }

        #call-screen { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 1000; flex-direction: column; align-items: center; justify-content: center; }
        #localVideo { width: 110px; height: 150px; position: absolute; top: 20px; right: 20px; border: 2px solid #ff85a1; border-radius: 12px; z-index: 1010; transform: scaleX(-1); }
        #remoteVideo { width: 100%; height: 100%; object-fit: cover; background: #111; }
        .call-ui-overlay { position: absolute; bottom: 50px; width: 100%; display: flex; justify-content: center; gap: 30px; z-index: 1020; }
        .c-btn { width: 70px; height: 70px; border-radius: 50%; border: none; font-size: 30px; cursor: pointer; color: white; }

        audio, video { border-radius: 12px; max-width: 100%; margin-top: 5px; }
        #prog-line { height: 4px; background: #ff4d6d; width: 0%; position: absolute; top: 0; left: 0; z-index: 100; transition: 0.3s; }
    </style>
</head>
<body onload="askName()">

<div id="calc-screen">
    <div id="display">0</div>
    <div class="buttons">
        <button class="btn gray" onclick="ad('')">AC</button><button class="btn gray">±</button><button class="btn gray">%</button><button class="btn orange" onclick="ad('/')">÷</button>
        <button class="btn" onclick="ad('7')">7</button><button class="btn" onclick="ad('8')">8</button><button class="btn" onclick="ad('9')">9</button><button class="btn orange" onclick="ad('*')">×</button>
        <button class="btn" onclick="ad('4')">4</button><button class="btn" onclick="ad('5')">5</button><button class="btn" onclick="ad('6')">6</button><button class="btn orange" onclick="ad('-')">−</button>
        <button class="btn" onclick="ad('1')">1</button><button class="btn" onclick="ad('2')">2</button><button class="btn" onclick="ad('3')">3</button><button class="btn orange" onclick="ad('+')">+</button>
        <button class="btn zero" onclick="ad('0')">0</button><button class="btn" onclick="ad('.')">.</button><button class="btn orange" onclick="calc()">=</button>
    </div>
</div>

<div id="chat-ui">
    <div class="hearts-container" id="hearts"></div>
    <div id="prog-line"></div>
    <div id="layer-bg"></div>
    <div class="header">
        <span onclick="if(confirm('مسح الكل؟')) db.ref('chat').remove()" style="font-size:24px; cursor:pointer;">💕</span>
        <div class="header-title">
            <div style="font-weight:bold; font-size:18px;">Nasro VIP 🌸</div>
            <div id="typing-status"></div>
        </div>
        <div style="display:flex; gap:15px;">
            <span onclick="startCall('voice')" style="font-size:24px; cursor:pointer;">📞</span>
            <span onclick="startCall('video')" style="font-size:24px; cursor:pointer;">📹</span>
        </div>
    </div>

    <div id="messages"></div>

    <div class="footer">
        <div class="input-area">
            <div class="input-box">
                <input type="text" id="mIn" placeholder="اكتبي رسالة... ✨" oninput="reportTyping()">
            </div>
            <div id="iconGroup" style="display:flex; gap:12px;">
                <label>🎬<input type="file" accept="video/*" hidden onchange="upFile(this,'vid')"></label>
                <label>📷<input type="file" accept="image/*" hidden onchange="upFile(this,'img')"></label>
            </div>
            <button id="sendBtn" style="display:none;" onclick="sendMsg()">🎀</button>
            <button id="recBtn" onclick="toggleMic()">🎙️</button>
        </div>
    </div>
</div>

<div id="call-screen">
    <video id="remoteVideo" autoplay playsinline></video>
    <video id="localVideo" autoplay playsinline muted></video>
    <div class="call-ui-overlay">
        <button class="c-btn" style="background:#4cd964; display:none;" id="answerBtn" onclick="acceptCall()">💖</button>
        <button class="c-btn" style="background:#ff3b30;" onclick="endCall()">🛑</button>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyBAA401qciK1eEzZKpZgD5P7D3rPENtoJA",
        authDomain: "ndndkk-a876d.firebaseapp.com",
        databaseURL: "https://ndndkk-a876d-default-rtdb.europe-west1.firebasedatabase.app",
        projectId: "ndndkk-a876d",
        storageBucket: "ndndkk-a876d.firebasestorage.app",
        messagingSenderId: "578615168170",
        appId: "1:578615168170:web:b65b54531115f49855d4d3",
        measurementId: "G-JXT0ND77KS"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    
    let user = localStorage.getItem("chat_user") || ""; 
    let exp = "", mediaRecorder, audioChunks = [];
    let localStream, peerConn;
    const rtcConfig = {'iceServers': [{'urls': 'stun:stun.l.google.com:19302'}]};

    function askName() { if(!user) { user = prompt("اسمك الجميل:") || "Queen"; localStorage.setItem("chat_user", user); } }
    function ad(v) { exp=(v==='')?'':exp+v; document.getElementById('display').innerText=exp||"0"; }
    function calc() { if(exp==="123332"){document.getElementById('calc-screen').style.display='none'; document.getElementById('chat-ui').style.display='flex'; initChat(); createHearts();} else {try{exp=eval(exp).toString(); document.getElementById('display').innerText=exp;}catch(e){exp='';}}}

    function createHearts() {
        const container = document.getElementById('hearts');
        setInterval(() => {
            const h = document.createElement('div');
            h.className = 'heart';
            h.innerHTML = ['💖','💗','💓','🌸'][Math.floor(Math.random()*4)];
            h.style.left = Math.random() * 100 + 'vw';
            h.style.animationDuration = (Math.random() * 3 + 2) + 's';
            container.appendChild(h);
            setTimeout(() => h.remove(), 5000);
        }, 700);
    }

    function initChat() {
        db.ref("chat").on("child_added", s => {
            let m = s.val();
            let d = document.createElement("div"); d.className = "bubble " + (m.u===user?"me":"other");
            let html = `<b>${m.u} ✨</b><br>`;
            if(m.t==='img') html += `<img src="${m.v}" style="width:100%; border-radius:10px;">`;
            else if(m.t==='vid') html += `<video controls src="${m.v}" style="width:100%; border-radius:10px;"></video>`;
            else if(m.t==='audio') html += `<audio controls src="${m.v}"></audio>`;
            else html += m.v;
            d.innerHTML = html + `<div style="font-size:9px; opacity:0.7; margin-top:5px;">${m.time}</div>`;
            document.getElementById("messages").appendChild(d);
            document.getElementById("messages").scrollTop = document.getElementById("messages").scrollHeight;
        });

        db.ref('typing').on('value', s => {
            let typers = [];
            s.forEach(c => { if(c.key !== user) typers.push(c.key); });
            document.getElementById('typing-status').innerText = typers.length ? "✍️ " + typers.join(' و ') + " يكتب..." : "";
        });

        db.ref('calls/' + user).on('value', async s => {
            let data = s.val();
            if(data && data.type === 'offer') {
                document.getElementById('call-screen').style.display = 'flex';
                document.getElementById('answerBtn').style.display = 'block';
            } else if (!data) { endCall(); }
        });
    }

    function reportTyping() {
        let val = document.getElementById('mIn').value.trim();
        document.getElementById('sendBtn').style.display = val ? 'flex' : 'none';
        document.getElementById('recBtn').style.display = val ? 'none' : 'flex';
        document.getElementById('iconGroup').style.display = val ? 'none' : 'flex';
        db.ref('typing/' + user).set(true);
        setTimeout(() => db.ref('typing/' + user).remove(), 3000);
    }

    async function startCall(mode) {
        let to = prompt("اسم الطرف الآخر؟"); if(!to) return;
        document.getElementById('call-screen').style.display = 'flex';
        localStream = await navigator.mediaDevices.getUserMedia({video: mode==='video', audio: true});
        document.getElementById('localVideo').srcObject = localStream;
        db.ref('calls/'+to).set({type:'offer', from: user});
    }

    function endCall() { 
        if(localStream) localStream.getTracks().forEach(t => t.stop());
        document.getElementById('call-screen').style.display = 'none';
        db.ref('calls/'+user).remove();
    }

    function sendMsg() {
        let v = document.getElementById('mIn').value.trim();
        if(v) { db.ref("chat").push({u:user, v:v, t:'txt', time:getTime()}); document.getElementById('mIn').value = ""; reportTyping(); }
    }

    async function toggleMic() {
        if (!mediaRecorder || mediaRecorder.state === "inactive") {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            mediaRecorder = new MediaRecorder(stream); audioChunks = [];
            mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
            mediaRecorder.onstop = () => {
                const blob = new Blob(audioChunks, { type: 'audio/webm' });
                const r = new FileReader(); r.readAsDataURL(blob);
                r.onloadend = () => db.ref("chat").push({u:user, v:r.result, t:'audio', time:getTime()});
                stream.getTracks().forEach(t => t.stop());
            };
            mediaRecorder.start(); document.getElementById('recBtn').classList.add('recording');
        } else {
            mediaRecorder.stop(); document.getElementById('recBtn').classList.remove('recording');
        }
    }

    function upFile(el, type) {
        let f = el.files[0]; if(!f) return;
        let r = new FileReader();
        r.onprogress = (e) => { if(e.lengthComputable) document.getElementById('prog-line').style.width = Math.round((e.loaded / e.total) * 100) + "%"; };
        r.onload = (e) => { 
            db.ref("chat").push({u:user, v:e.target.result, t:type, time:getTime()}).then(() => {
                document.getElementById('prog-line').style.width = "0%"; el.value = "";
            });
        };
        r.readAsDataURL(f);
    }

    function getTime() { return new Date().toLocaleTimeString('ar-EG',{hour:'2-digit',minute:'2-digit'}); }
</script>
</body>
</html>
